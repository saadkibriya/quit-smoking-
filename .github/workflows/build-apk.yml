name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Detect Capacitor major version
        id: core
        run: echo "major=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")" >> "$GITHUB_OUTPUT"

      - name: Install Preferences plugin (same major as core)
        run: npm install "@capacitor/preferences@^${{ steps.core.outputs.major }}.0.0" --no-save

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.core.outputs.major >= 7 && '21' || '17' }}

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Add home screen widget
        run: bash scripts/add-widget.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Unlit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Unlit-apk
          path: Unlit.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Unlit.apk \
            --title "Unlit build ${{ github.run_number }}" \
            --notes "Automated build" \
            --target "${{ github.sha }}"
