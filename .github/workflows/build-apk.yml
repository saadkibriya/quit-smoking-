name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Install ALL deps including devDependencies (NODE_ENV must not be production)
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_ENV: development

      # Build the Vite bundle â†’ dist/  (capacitor.config.ts points webDir to dist)
      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ''

      # Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Verify cap CLI is present, then add android platform
      - name: Add Capacitor Android platform
        run: |
          ls node_modules/.bin/cap || (echo "cap not found, reinstalling @capacitor/cli" && npm install --legacy-peer-deps --save-dev @capacitor/cli)
          node_modules/.bin/cap add android
        env:
          NODE_ENV: development
          CAPACITOR_ANDROID_STUDIO_PATH: ''

      - name: Sync Capacitor
        run: node_modules/.bin/cap sync android
        env:
          NODE_ENV: development

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unlit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Unlit build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
