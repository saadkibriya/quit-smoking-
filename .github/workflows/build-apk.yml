name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No cache: 'npm' â€” repo has bun.lock not package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Use npm install (not npm ci) because there is no package-lock.json
      - name: Install dependencies
        run: npm install

      # Build the Vite bundle â†’ dist/  (capacitor.config.ts points webDir to dist)
      - name: Build web app
        run: npm run build
        env:
          # Suppress any missing VITE_ env vars that aren't needed for the build
          VITE_API_BASE_URL: ''

      # Accept Android SDK licenses (SDK is pre-installed on ubuntu-latest)
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unlit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Unlit build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
